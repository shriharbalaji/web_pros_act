<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout · ShopEasy</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="checkout">
  <header id="site-header"></header>
  <main class="container">
    <h1>Checkout</h1>
    <div id="checkout" class="checkout">
      <form id="checkout-form" class="form">
        <h3>Shipping address</h3>
        <label>Full name <input name="name" required></label>
        <label>Address <input name="address" required></label>
        <div class="two">
          <label>City <input name="city" required></label>
          <label>ZIP / Postcode <input name="zip" required pattern="[A-Za-z0-9 -]{3,10}"></label>
        </div>
        <h3>Payment (demo only, no real charge)</h3>
        <label>Card number <input name="card" inputmode="numeric" placeholder="16 digits" required pattern="\d{16}"></label>
        <div class="two">
          <label>Expiry (MM/YY) <input name="exp" placeholder="MM/YY" required pattern="(0[1-9]|1[0-2])/\d{2}"></label>
          <label>CVV <input name="cvv" inputmode="numeric" required pattern="\d{3,4}"></label>
        </div>
        <button class="btn" type="submit">Place order</button>
      </form>
      <aside>
        <h3>Order summary</h3>
        <ul id="order-summary" class="order"></ul>
      </aside>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <div id="toast" class="toast" hidden></div>
  <script src="js/app.js"></script>
</body>
</html>
