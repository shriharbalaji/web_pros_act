<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · ShopEasy</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
  <header id="site-header"></header>
  <main class="container">
    <div class="auth">
      <div class="tabs">
        <button type="button" class="active" data-tab="login">Login</button>
        <button type="button" data-tab="register">Register</button>
      </div>

      <form id="login-form">
        <label>Email <input type="email" name="email" required></label>
        <label>Password <input type="password" name="password" required></label>
        <p class="msg" id="login-msg"></p>
        <button class="btn" type="submit">Login</button>
      </form>

      <form id="register-form" hidden>
        <label>Full name <input name="name" required></label>
        <label>Email <input type="email" name="email" required></label>
        <label>Password (min 6 characters) <input type="password" name="password" minlength="6" required></label>
        <p class="msg" id="reg-msg"></p>
        <button class="btn" type="submit">Create account</button>
      </form>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <div id="toast" class="toast" hidden></div>
  <script src="js/app.js"></script>
</body>
</html>
