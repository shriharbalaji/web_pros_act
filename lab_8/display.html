<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Details</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #eef2f7;
      margin: 0;
      padding: 30px 15px;
    }
    .card {
      background: #fff;
      max-width: 560px;
      margin: 0 auto;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
    }
    h1 { margin-top: 0; color: #1f3b63; font-size: 24px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td {
      text-align: left;
      padding: 12px 10px;
      border-bottom: 1px solid #e3e3e3;
      font-size: 15px;
    }
    th { width: 35%; color: #555; background: #f7f9fc; }
    td { color: #222; word-break: break-word; }
    .message { color: #555; font-size: 16px; }
    .buttons { display: flex; gap: 10px; margin-top: 24px; }
    .btn {
      flex: 1;
      text-align: center;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      color: #fff;
      text-decoration: none;
    }
    .primary { background: #2f6fdb; }
    .primary:hover { background: #1f57b8; }
    .danger { background: #c0392b; }
    .danger:hover { background: #a93226; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Submitted User Details</h1>

    <div id="output"></div>

    <div class="buttons">
      <a href="index.html" class="btn primary">Edit Details</a>
      <button type="button" class="btn danger" id="clearBtn">Clear All</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
