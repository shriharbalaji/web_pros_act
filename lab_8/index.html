<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Information Form</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #eef2f7;
      margin: 0;
      padding: 30px 15px;
    }
    .card {
      background: #fff;
      max-width: 560px;
      margin: 0 auto;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
    }
    h1 { margin-top: 0; color: #1f3b63; font-size: 24px; }
    .field { margin-bottom: 16px; }
    .title { display: block; font-weight: bold; margin-bottom: 6px; color: #333; }
    input[type="text"], input[type="tel"], input[type="email"], select {
      width: 100%;
      padding: 10px;
      border: 1px solid #bbb;
      border-radius: 6px;
      font-size: 15px;
    }
    input:focus, select:focus { outline: none; border-color: #2f6fdb; }
    .radio-group label { margin-right: 18px; font-size: 15px; cursor: pointer; }
    .error { color: #c0392b; font-size: 13px; min-height: 16px; display: block; margin-top: 4px; }
    .buttons { display: flex; gap: 10px; margin-top: 10px; }
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      color: #fff;
      text-align: center;
    }
    .primary { background: #2f6fdb; }
    .primary:hover { background: #1f57b8; }
    .secondary { background: #e0e0e0; color: #333; }
    .secondary:hover { background: #cfcfcf; }
  </style>
</head>
<body>
  <div class="card">
    <h1>User Information Form</h1>

    <form id="userForm" novalidate>
      <div class="field">
        <label class="title" for="name">Full Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name">
        <span class="error" id="err-name"></span>
      </div>

      <div class="field">
        <span class="title">Gender</span>
        <div class="radio-group">
          <label><input type="radio" name="gender" value="Male"> Male</label>
          <label><input type="radio" name="gender" value="Female"> Female</label>
          <label><input type="radio" name="gender" value="Other"> Other</label>
        </div>
        <span class="error" id="err-gender"></span>
      </div>

      <div class="field">
        <label class="title" for="mobile">Mobile Number</label>
        <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile number" maxlength="10">
        <span class="error" id="err-mobile"></span>
      </div>

      <div class="field">
        <label class="title" for="email">Mail ID</label>
        <input type="email" id="email" name="email" placeholder="you@example.com">
        <span class="error" id="err-email"></span>
      </div>

      <div class="field">
        <label class="title" for="city">City</label>
        <input type="text" id="city" name="city" placeholder="Enter your city">
        <span class="error" id="err-city"></span>
      </div>

      <div class="field">
        <label class="title" for="state">State</label>
        <input type="text" id="state" name="state" placeholder="Enter your state">
        <span class="error" id="err-state"></span>
      </div>

      <div class="field">
        <label class="title" for="country">Country</label>
        <select id="country" name="country">
          <option value="">-- Select Country --</option>
          <option value="India">India</option>
          <option value="United States">United States</option>
          <option value="United Kingdom">United Kingdom</option>
          <option value="Canada">Canada</option>
          <option value="Australia">Australia</option>
          <option value="Germany">Germany</option>
          <option value="France">France</option>
          <option value="Japan">Japan</option>
          <option value="China">China</option>
          <option value="Other">Other</option>
        </select>
        <span class="error" id="err-country"></span>
      </div>

      <div class="buttons">
        <button type="submit" class="btn primary">Submit</button>
        <button type="reset" class="btn secondary">Reset</button>
      </div>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
