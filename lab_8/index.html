<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Registration</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <h1>User Registration</h1>
      <p>Please provide your personal details. All fields are required.</p>
    </div>
  </header>

  <main class="container">
    <form id="userForm" class="card" novalidate>

      <section class="section">
        <h2>Personal information</h2>
        <div class="grid">

          <div class="field full" data-field="fullName">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" name="fullName" autocomplete="name" placeholder="e.g. Priya Sharma">
            <span class="error" role="alert"></span>
          </div>

          <div class="field full" data-field="gender">
            <span class="label">Gender</span>
            <div class="radio-group">
              <label class="radio">
                <input type="radio" name="gender" value="Male"> Male
              </label>
              <label class="radio">
                <input type="radio" name="gender" value="Female"> Female
              </label>
              <label class="radio">
                <input type="radio" name="gender" value="Other"> Other
              </label>
              <label class="radio">
                <input type="radio" name="gender" value="Prefer not to say"> Prefer not to say
              </label>
            </div>
            <span class="error" role="alert"></span>
          </div>

        </div>
      </section>

      <section class="section">
        <h2>Contact details</h2>
        <div class="grid">

          <div class="field" data-field="mobile">
            <label for="mobile">Mobile number</label>
            <input type="tel" id="mobile" name="mobile" autocomplete="tel" placeholder="e.g. +91 98765 43210">
            <span class="error" role="alert"></span>
          </div>

          <div class="field" data-field="email">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" autocomplete="email" placeholder="name@example.com">
            <span class="error" role="alert"></span>
          </div>

        </div>
      </section>

      <section class="section">
        <h2>Location</h2>
        <div class="grid">

          <div class="field" data-field="city">
            <label for="city">City</label>
            <input type="text" id="city" name="city" autocomplete="address-level2" placeholder="e.g. Bengaluru">
            <span class="error" role="alert"></span>
          </div>

          <div class="field" data-field="state">
            <label for="state">State / Province</label>
            <input type="text" id="state" name="state" autocomplete="address-level1" placeholder="e.g. Karnataka">
            <span class="error" role="alert"></span>
          </div>

          <div class="field full" data-field="country">
            <label for="country">Country</label>
            <select id="country" name="country" autocomplete="country-name">
              <option value="">Select a country</option>
              <option>Australia</option>
              <option>Canada</option>
              <option>France</option>
              <option>Germany</option>
              <option>India</option>
              <option>Singapore</option>
              <option>United Arab Emirates</option>
              <option>United Kingdom</option>
              <option>United States</option>
              <option>Other</option>
            </select>
            <span class="error" role="alert"></span>
          </div>

        </div>
      </section>

      <footer class="actions">
        <button type="reset" class="btn btn-secondary">Clear form</button>
        <button type="submit" class="btn btn-primary">Submit details</button>
      </footer>

    </form>
  </main>

  <footer class="site-footer">
    <div class="container">&copy; 2026 User Registration. Your details are stored only in this browser session.</div>
  </footer>

  <script src="js/form.js"></script>
</body>
</html>
