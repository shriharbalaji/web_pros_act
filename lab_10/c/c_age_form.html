<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Verification</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="topbar">
        <span class="brand">Visitor Verification</span>
    </div>

    <div class="container">
        <div class="card">
            <h1>Visitor Verification</h1>
            <p class="subtitle">Please enter your details to continue.</p>

            <form method="post" action="c_check_age.php">
                <label for="name">Full name</label>
                <input type="text" id="name" name="name" required maxlength="100">

                <label for="age">Age</label>
                <input type="number" id="age" name="age" required min="0" max="120">

                <button type="submit" class="btn">Submit</button>
            </form>
        </div>
    </div>
</body>
</html>
