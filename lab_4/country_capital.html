<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country Capital Selector</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-top: 0;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        label {
            font-weight: 600;
            color: #555;
            font-size: 16px;
        }

        select {
            padding: 10px 15px;
            border: 2px solid #667eea;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            background-color: white;
            color: #333;
            transition: border-color 0.3s ease;
            flex: 1;
            min-width: 200px;
        }

        select:hover {
            border-color: #764ba2;
        }

        select:focus {
            outline: none;
            border-color: #764ba2;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background-color: #f8f9fa;
            border-radius: 8px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .capital-display {
            color: #e74c3c;
            font-weight: bold;
            font-size: 28px;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .placeholder {
            color: #999;
            font-style: italic;
            font-weight: normal;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 Country Capital Selector</h1>
        
        <div class="input-group">
            <label for="countrySelect">Select a Country:</label>
            <select id="countrySelect">
                <option value="">-- Choose a country --</option>
                <option value="France">France</option>
                <option value="Japan">Japan</option>
                <option value="Brazil">Brazil</option>
                <option value="Egypt">Egypt</option>
                <option value="Australia">Australia</option>
            </select>
        </div>

        <div class="result">
            <div id="capitalDisplay" class="placeholder">Select a country to see its capital</div>
        </div>
    </div>

    <script>
        const countryCapitals = {
            'France': 'Paris',
            'Japan': 'Tokyo',
            'Brazil': 'Brasília',
            'Egypt': 'Cairo',
            'Australia': 'Canberra'
        };

        const selectElement = document.getElementById('countrySelect');
        const capitalDisplay = document.getElementById('capitalDisplay');

        selectElement.addEventListener('change', function() {
            const selectedCountry = this.value;

            if (selectedCountry === '') {
                capitalDisplay.textContent = 'Select a country to see its capital';
                capitalDisplay.className = 'placeholder';
            } else {
                const capital = countryCapitals[selectedCountry];
                capitalDisplay.textContent = capital;
                capitalDisplay.className = 'capital-display';
            }
        });
    </script>
</body>
</html>
