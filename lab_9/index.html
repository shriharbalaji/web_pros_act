<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employee XML Viewer</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --text: #1d2330;
    --muted: #6b7385;
    --border: #e2e5ec;
    --accent: #2f6fed;
    --accent-soft: #e8efff;
    --row-alt: #fafbfd;
    --error-bg: #fdecec;
    --error-text: #a12626;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151c;
      --surface: #1b2029;
      --text: #e6e9f0;
      --muted: #9aa3b5;
      --border: #2c3340;
      --accent: #6b97ff;
      --accent-soft: #223050;
      --row-alt: #171b23;
      --error-bg: #3a1d1d;
      --error-text: #ffb3b3;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151c;
    --surface: #1b2029;
    --text: #e6e9f0;
    --muted: #9aa3b5;
    --border: #2c3340;
    --accent: #6b97ff;
    --accent-soft: #223050;
    --row-alt: #171b23;
    --error-bg: #3a1d1d;
    --error-text: #ffb3b3;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.45;
  }
  header {
    padding: 24px 28px 8px;
  }
  h1 { margin: 0 0 4px; font-size: 22px; font-weight: 650; }
  .subtitle { margin: 0; color: var(--muted); font-size: 14px; }

  main { padding: 16px 28px 40px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 16px;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
  }
  .btn {
    appearance: none;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    padding: 8px 14px;
    border-radius: 8px;
    font: inherit;
    font-weight: 550;
    cursor: pointer;
  }
  .btn.secondary {
    background: transparent;
    color: var(--accent);
  }
  .btn:focus-visible, input:focus-visible, select:focus-visible, th:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  input[type="search"], select {
    font: inherit;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
  }
  input[type="search"] { min-width: 240px; flex: 1; max-width: 360px; }
  .spacer { flex: 1; }
  .meta { color: var(--muted); font-size: 13px; }

  #fileInput { display: none; }

  details.paste summary {
    cursor: pointer;
    color: var(--accent);
    font-weight: 550;
    margin-top: 12px;
  }
  details.paste textarea {
    width: 100%;
    min-height: 160px;
    margin-top: 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    resize: vertical;
  }

  .error {
    background: var(--error-bg);
    color: var(--error-text);
    border-radius: 8px;
    padding: 10px 14px;
    margin-top: 12px;
    font-size: 14px;
  }

  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 760px;
  }
  thead th {
    position: sticky;
    top: 0;
    background: var(--accent-soft);
    color: var(--text);
    text-align: left;
    font-weight: 600;
    font-size: 13px;
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  thead th .arrow { color: var(--muted); margin-left: 4px; font-size: 11px; }
  thead th[aria-sort="ascending"] .arrow::after { content: "▲"; color: var(--accent); }
  thead th[aria-sort="descending"] .arrow::after { content: "▼"; color: var(--accent); }
  thead th:not([aria-sort]) .arrow::after { content: "↕"; }

  tbody td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:last-child td { border-bottom: none; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .status {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    background: var(--accent-soft);
    color: var(--accent);
  }
  .status.inactive { background: var(--error-bg); color: var(--error-text); }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 32px;
  }
  .hidden { display: none !important; }

  tbody tr[data-index] { cursor: pointer; }
  tbody tr[data-index]:hover td { background: var(--accent-soft); }
  tbody tr.selected td { background: var(--accent-soft); }

  .details-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: grid;
    place-items: center;
    font-weight: 650;
    flex-shrink: 0;
  }
  .details-head h2 { margin: 0; font-size: 18px; font-weight: 650; }
  .details-head .sub { color: var(--muted); font-size: 13px; }
  .details-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 14px 22px;
  }
  .detail dt {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin-bottom: 2px;
  }
  .detail dd { margin: 0; font-size: 15px; word-break: break-word; }
  .hint { color: var(--muted); font-size: 13px; margin: 0 0 10px; }
</style>
</head>
<body>

<header>
  <h1>Employee Directory</h1>
  <p class="subtitle">Load an XML file of employee records and view it as a table.</p>
</header>

<main>
  <section class="card">
    <div class="controls">
      <button class="btn" id="chooseBtn" type="button">Choose XML file</button>
      <button class="btn secondary" id="sampleBtn" type="button">Load sample data</button>
      <input type="file" id="fileInput" accept=".xml,text/xml,application/xml">
      <div class="spacer"></div>
      <input type="search" id="searchBox" placeholder="Search employees…" aria-label="Search employees" disabled>
      <select id="deptFilter" aria-label="Filter by department" disabled>
        <option value="">All departments</option>
      </select>
    </div>

    <details class="paste">
      <summary>Or paste XML content</summary>
      <textarea id="xmlInput" spellcheck="false" placeholder="<employees>&#10;  <employee id=&quot;1&quot;>…</employee>&#10;</employees>"></textarea>
      <div class="controls" style="margin-top:10px">
        <button class="btn" id="parsePasteBtn" type="button">Parse XML</button>
      </div>
    </details>

    <div id="errorBox" class="error hidden" role="alert"></div>
  </section>

  <section class="card" style="padding:0; overflow:hidden">
    <div class="table-wrap">
      <table id="empTable" aria-describedby="rowCount">
        <thead>
          <tr>
            <th data-key="id">ID<span class="arrow"></span></th>
            <th data-key="name">Name<span class="arrow"></span></th>
            <th data-key="department">Department<span class="arrow"></span></th>
            <th data-key="designation">Designation<span class="arrow"></span></th>
            <th data-key="email">Email<span class="arrow"></span></th>
            <th data-key="phone">Phone<span class="arrow"></span></th>
            <th data-key="location">Location<span class="arrow"></span></th>
            <th data-key="salary" class="num">Salary<span class="arrow"></span></th>
            <th data-key="joined">Joined<span class="arrow"></span></th>
            <th data-key="status">Status<span class="arrow"></span></th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr><td colspan="10" class="empty">No data loaded yet.</td></tr>
        </tbody>
      </table>
    </div>
    <div class="meta" id="rowCount" style="padding:10px 14px">&nbsp;</div>
  </section>

  <section class="card hidden" id="detailCard" aria-live="polite">
    <p class="hint">Click any row to see all of that employee's details.</p>
    <div class="details-head">
      <div class="avatar" id="dAvatar"></div>
      <div>
        <h2 id="dName"></h2>
        <div class="sub" id="dSub"></div>
      </div>
    </div>
    <dl class="details-grid" id="dGrid"></dl>
  </section>
</main>

<script>
(() => {
  const SAMPLE_XML = `<?xml version="1.0" encoding="UTF-8"?>
<employees>
  <employee id="E101">
    <name>Aarav Sharma</name>
    <department>Engineering</department>
    <designation>Senior Software Engineer</designation>
    <email>aarav.sharma@example.com</email>
    <phone>+91 98450 11223</phone>
    <location>Bengaluru</location>
    <salary currency="INR">2400000</salary>
    <joined>2019-07-15</joined>
    <status>Active</status>
  </employee>
  <employee id="E102">
    <name>Priya Nair</name>
    <department>Human Resources</department>
    <designation>HR Manager</designation>
    <email>priya.nair@example.com</email>
    <phone>+91 98450 22334</phone>
    <location>Kochi</location>
    <salary currency="INR">1500000</salary>
    <joined>2021-02-01</joined>
    <status>Active</status>
  </employee>
  <employee id="E103">
    <name>Rohan Mehta</name>
    <department>Finance</department>
    <designation>Financial Analyst</designation>
    <email>rohan.mehta@example.com</email>
    <phone>+91 98450 33445</phone>
    <location>Mumbai</location>
    <salary currency="INR">1200000</salary>
    <joined>2020-11-10</joined>
    <status>Inactive</status>
  </employee>
  <employee id="E104">
    <name>Sneha Reddy</name>
    <department>Engineering</department>
    <designation>Engineering Manager</designation>
    <email>sneha.reddy@example.com</email>
    <phone>+91 98450 44556</phone>
    <location>Hyderabad</location>
    <salary currency="INR">3100000</salary>
    <joined>2017-03-20</joined>
    <status>Active</status>
  </employee>
  <employee id="E105">
    <name>Vikram Iyer</name>
    <department>Marketing</department>
    <designation>Content Strategist</designation>
    <email>vikram.iyer@example.com</email>
    <phone>+91 98450 55667</phone>
    <location>Chennai</location>
    <salary currency="INR">1350000</salary>
    <joined>2022-06-05</joined>
    <status>Active</status>
  </employee>
</employees>`;

  const COLUMNS = ["id","name","department","designation","email","phone","location","salary","joined","status"];

  const state = { rows: [], sortKey: null, sortDir: 1 };

  const el = {
    chooseBtn: document.getElementById("chooseBtn"),
    sampleBtn: document.getElementById("sampleBtn"),
    fileInput: document.getElementById("fileInput"),
    parsePasteBtn: document.getElementById("parsePasteBtn"),
    xmlInput: document.getElementById("xmlInput"),
    searchBox: document.getElementById("searchBox"),
    deptFilter: document.getElementById("deptFilter"),
    errorBox: document.getElementById("errorBox"),
    tbody: document.getElementById("tableBody"),
    rowCount: document.getElementById("rowCount"),
    headers: document.querySelectorAll("#empTable thead th"),
  };

  function text(node, tag) {
    const child = node.getElementsByTagName(tag)[0];
    return child ? child.textContent.trim() : "";
  }

  function parseXML(xmlString) {
    const doc = new DOMParser().parseFromString(xmlString, "application/xml");
    const parseError = doc.getElementsByTagName("parsererror")[0];
    if (parseError) {
      throw new Error("The XML is not well-formed: " + parseError.textContent.split("\n")[0]);
    }
    const nodes = doc.getElementsByTagName("employee");
    if (nodes.length === 0) {
      throw new Error("No <employee> elements were found in this XML.");
    }
    return Array.from(nodes).map(node => {
      const salaryNode = node.getElementsByTagName("salary")[0];
      const salaryRaw = salaryNode ? salaryNode.textContent.trim() : "";
      const salaryNum = Number(salaryRaw.replace(/[^\d.-]/g, ""));
      return {
        id: node.getAttribute("id") || text(node, "id"),
        name: text(node, "name"),
        department: text(node, "department"),
        designation: text(node, "designation"),
        email: text(node, "email"),
        phone: text(node, "phone"),
        location: text(node, "location"),
        salary: Number.isFinite(salaryNum) ? salaryNum : null,
        salaryCurrency: salaryNode ? salaryNode.getAttribute("currency") || "" : "",
        joined: text(node, "joined"),
        status: text(node, "status"),
      };
    });
  }

  function showError(msg) {
    el.errorBox.textContent = msg;
    el.errorBox.classList.remove("hidden");
  }
  function clearError() {
    el.errorBox.classList.add("hidden");
    el.errorBox.textContent = "";
  }

  function loadXML(xmlString) {
    clearError();
    try {
      state.rows = parseXML(xmlString);
    } catch (err) {
      showError(err.message);
      return;
    }
    populateDepartments();
    el.searchBox.disabled = false;
    el.deptFilter.disabled = false;
    el.searchBox.value = "";
    el.deptFilter.value = "";
    state.sortKey = null;
    el.headers.forEach(h => h.removeAttribute("aria-sort"));
    render();
  }

  function populateDepartments() {
    const depts = [...new Set(state.rows.map(r => r.department).filter(Boolean))].sort();
    el.deptFilter.innerHTML = '<option value="">All departments</option>' +
      depts.map(d => `<option value="${escapeAttr(d)}">${escapeHTML(d)}</option>`).join("");
  }

  function filteredRows() {
    const q = el.searchBox.value.trim().toLowerCase();
    const dept = el.deptFilter.value;
    let rows = state.rows.filter(r => {
      if (dept && r.department !== dept) return false;
      if (!q) return true;
      return COLUMNS.some(c => String(r[c] ?? "").toLowerCase().includes(q));
    });
    if (state.sortKey) {
      const k = state.sortKey, d = state.sortDir;
      rows = [...rows].sort((a, b) => {
        const av = a[k], bv = b[k];
        if (av == null && bv == null) return 0;
        if (av == null) return 1;
        if (bv == null) return -1;
        if (typeof av === "number" && typeof bv === "number") return (av - bv) * d;
        return String(av).localeCompare(String(bv), undefined, { numeric: true, sensitivity: "base" }) * d;
      });
    }
    return rows;
  }

  function formatSalary(r) {
    if (r.salary == null) return "—";
    const cur = r.salaryCurrency || "INR";
    try {
      return new Intl.NumberFormat("en-IN", { style: "currency", currency: cur, maximumFractionDigits: 0 }).format(r.salary);
    } catch {
      return r.salary.toLocaleString("en-IN");
    }
  }

  function formatDate(s) {
    if (!s) return "—";
    const d = new Date(s);
    return isNaN(d) ? s : d.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });
  }

  function render() {
    const rows = filteredRows();
    if (state.rows.length === 0) {
      el.tbody.innerHTML = `<tr><td colspan="10" class="empty">No data loaded yet.</td></tr>`;
      el.rowCount.textContent = "\u00a0";
      return;
    }
    if (rows.length === 0) {
      el.tbody.innerHTML = `<tr><td colspan="10" class="empty">No employees match your filters.</td></tr>`;
    } else {
      currentRows = rows;
      el.tbody.innerHTML = rows.map((r, i) => `
        <tr data-index="${i}">
          <td>${escapeHTML(r.id)}</td>
          <td><strong>${escapeHTML(r.name)}</strong></td>
          <td>${escapeHTML(r.department)}</td>
          <td>${escapeHTML(r.designation)}</td>
          <td>${r.email ? `<a href="mailto:${escapeAttr(r.email)}">${escapeHTML(r.email)}</a>` : "—"}</td>
          <td>${escapeHTML(r.phone) || "—"}</td>
          <td>${escapeHTML(r.location) || "—"}</td>
          <td class="num">${formatSalary(r)}</td>
          <td>${formatDate(r.joined)}</td>
          <td><span class="status ${r.status.toLowerCase() === "inactive" ? "inactive" : ""}">${escapeHTML(r.status) || "—"}</span></td>
        </tr>`).join("");
    }
    el.rowCount.textContent = `Showing ${rows.length} of ${state.rows.length} employee${state.rows.length === 1 ? "" : "s"}`;
  }

  let currentRows = [];
  let selectedIndex = null;

  function showDetails(r, idx) {
    selectedIndex = idx;
    document.querySelectorAll("#tableBody tr").forEach(tr => tr.classList.toggle("selected", Number(tr.dataset.index) === idx));
    const initials = r.name.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
    document.getElementById("dAvatar").textContent = initials || "?";
    document.getElementById("dName").textContent = r.name || "Unnamed";
    document.getElementById("dSub").textContent = [r.designation, r.department].filter(Boolean).join(" · ");
    const fields = [
      ["Employee ID", r.id],
      ["Department", r.department],
      ["Designation", r.designation],
      ["Email", r.email],
      ["Phone", r.phone],
      ["Location", r.location],
      ["Salary", formatSalary(r)],
      ["Joined", formatDate(r.joined)],
      ["Status", r.status],
    ];
    document.getElementById("dGrid").innerHTML = fields.map(([label, value]) => `
      <div class="detail"><dt>${label}</dt><dd>${value ? escapeHTML(value) : "—"}</dd></div>`).join("");
    document.getElementById("detailCard").classList.remove("hidden");
  }

  el.tbody.addEventListener("click", e => {
    const tr = e.target.closest("tr[data-index]");
    if (!tr) return;
    const idx = Number(tr.dataset.index);
    showDetails(currentRows[idx], idx);
  });

  function escapeHTML(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function escapeAttr(s) { return escapeHTML(s); }

  el.headers.forEach(th => {
    th.tabIndex = 0;
    const sortBy = () => {
      const key = th.dataset.key;
      if (state.sortKey === key) {
        state.sortDir *= -1;
      } else {
        state.sortKey = key;
        state.sortDir = 1;
      }
      el.headers.forEach(h => h.removeAttribute("aria-sort"));
      th.setAttribute("aria-sort", state.sortDir === 1 ? "ascending" : "descending");
      render();
    };
    th.addEventListener("click", sortBy);
    th.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); sortBy(); } });
  });

  el.chooseBtn.addEventListener("click", () => el.fileInput.click());
  el.fileInput.addEventListener("change", async e => {
    const file = e.target.files[0];
    if (!file) return;
    const text = await file.text();
    el.xmlInput.value = text;
    loadXML(text);
    e.target.value = "";
  });
  el.sampleBtn.addEventListener("click", () => {
    el.xmlInput.value = SAMPLE_XML;
    loadXML(SAMPLE_XML);
  });
  el.parsePasteBtn.addEventListener("click", () => {
    const val = el.xmlInput.value.trim();
    if (!val) { showError("Paste some XML first."); return; }
    loadXML(val);
  });
  el.searchBox.addEventListener("input", render);
  el.deptFilter.addEventListener("change", render);

  // Show the sample data straight away so the page is never empty on open.
  el.xmlInput.value = SAMPLE_XML;
  loadXML(SAMPLE_XML);
})();
</script>
</body>
</html>
