<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f4f5f7; display: flex; justify-content: center; align-items: center;
      min-height: 100vh; margin: 0; padding: 1rem;
    }
    .card {
      background: #fff; padding: 2rem; border-radius: 8px; width: 100%; max-width: 340px;
      box-shadow: 0 2px 8px rgba(0,0,0,.1); text-align: center;
    }
    h2 { margin: 0 0 1.5rem; }
    label { display: block; text-align: left; font-size: .9rem; color: #374151; margin-bottom: .3rem; }
    input {
      width: 100%; padding: .6rem .7rem; margin-bottom: 1rem;
      border: 1px solid #d1d5db; border-radius: 4px; font-size: 1rem;
    }
    input:focus { outline: 2px solid #93c5fd; border-color: #2563eb; }
    button {
      width: 100%; padding: .7rem; background: #2563eb; color: #fff; border: 0;
      border-radius: 4px; font-size: 1rem; cursor: pointer;
    }
    button:hover:not(:disabled) { background: #1d4ed8; }
    button:disabled { background: #93c5fd; cursor: default; }
    .error {
      color: #b91c1c; background: #fee2e2; padding: .6rem; border-radius: 4px;
      margin: 1rem 0 0; font-size: .95rem;
    }
    .ok { color: #15803d; }
    .view { display: none; }
    .view.active { display: block; }
    .link { background: none; color: #2563eb; width: auto; padding: 0; margin-top: 1rem; }
    .link:hover { background: none; text-decoration: underline; }
  </style>
</head>
<body>
  <main class="card">

    <!-- Login page: shows the failure message here if the check fails -->
    <section id="login" class="view active">
      <h2>User Login</h2>
      <form id="loginForm">
        <label for="username">Username</label>
        <input type="text" id="username" autocomplete="username" required autofocus>
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
        <button type="submit" id="submitBtn">Login</button>
      </form>
      <p id="loginError" class="error" role="alert" hidden></p>
    </section>

    <!-- Success page: shown only when the username and password match -->
    <section id="success" class="view">
      <h2 class="ok">Login Successful</h2>
      <p>Welcome, <strong id="welcomeName"></strong>!</p>
      <button class="link" data-goto="login">Log out</button>
    </section>

  </main>

  <script>
    /*
      User "database". Each entry stores a salt and the SHA-256 hash of
      (salt + ":" + password). Plain-text passwords are never stored.

      Demo login: alice / secret123
    */
    const USERS = {
      alice: {
        salt: "demo-salt",
        hash: "0a5dd9f60fd78310182fda73482acec1c468d654963f7536c82aa10f6545fcd2",
      },
    };

    const form = document.getElementById("loginForm");
    const submitBtn = document.getElementById("submitBtn");
    const loginError = document.getElementById("loginError");
    const passwordInput = document.getElementById("password");

    function showView(name) {
      document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === name));
    }

    async function sha256Hex(text) {
      const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, "0")).join("");
    }

    async function checkCredentials(username, password) {
      if (!Object.prototype.hasOwnProperty.call(USERS, username)) return false;
      const user = USERS[username];
      return (await sha256Hex(user.salt + ":" + password)) === user.hash;
    }

    document.addEventListener("click", (e) => {
      const target = e.target.closest("[data-goto]");
      if (target) {
        form.reset();
        loginError.hidden = true;
        showView(target.dataset.goto);
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      loginError.hidden = true;
      submitBtn.disabled = true;

      const username = document.getElementById("username").value.trim();
      const password = passwordInput.value;

      try {
        if (await checkCredentials(username, password)) {
          document.getElementById("welcomeName").textContent = username;
          form.reset();
          showView("success");
        } else {
          passwordInput.value = "";
          loginError.textContent = "Invalid username or password.";
          loginError.hidden = false;
        }
      } catch (err) {
        loginError.textContent = "Login check failed in this browser: " + err.message;
        loginError.hidden = false;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
